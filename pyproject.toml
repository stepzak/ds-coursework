[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frameworks-coursework"
version = "0.1.0"
description = "Reproducible EDA of Sentiment Labelled Sentences and Oxford-IIIT Pet"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4", "Pillow>=11,<13"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "nbformat>=5,<6", "nbclient>=0.10,<1", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]
