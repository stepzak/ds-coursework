services:
  label-studio:
    image: heartexlabs/label-studio@sha256:afcc516a22775a39d0d66f4c2ddc95d01be3e3d3862b21fcf4f9de34b4ad4e12
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
      LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT: /label-studio/files
    volumes:
      - label-studio-data:/label-studio/data
      - ./images:/label-studio/files/images:ro

volumes:
  label-studio-data:
